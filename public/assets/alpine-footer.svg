<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="An animated pine treeline in the mist">
  <style>
    .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @keyframes drift { 0% { transform: translateX(-30px) } 100% { transform: translateX(30px) } }
    @keyframes sway  { 0%,100% { transform: rotate(-.6deg) } 50% { transform: rotate(.6deg) } }
    @keyframes fall  { 0% { transform: translateY(-24px); opacity:0 } 15% { opacity:.85 } 100% { transform: translateY(170px); opacity:0 } }
    @keyframes soft  { 0%,100% { opacity:.35 } 50% { opacity:.75 } }
    .mist  { animation: drift 24s ease-in-out infinite alternate }
    .tree  { animation: sway 9s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center }
    .flake { animation: fall linear infinite }
    .moon  { animation: soft 7s ease-in-out infinite }
    @media (prefers-reduced-motion: reduce) { .mist,.tree,.flake,.moon { animation: none } }
  </style>
  <defs>
    <linearGradient id="fsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#243a4e"/>
      <stop offset="60%"  stop-color="#12202e"/>
      <stop offset="100%" stop-color="#080e15"/>
    </linearGradient>
    <linearGradient id="fmist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a9c7dd" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a9c7dd" stop-opacity=".2"/>
    </linearGradient>
    <clipPath id="fc"><rect x="0" y="0" width="1200" height="150" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#fc)">
    <rect width="1200" height="150" fill="url(#fsky)"/>

    <g class="moon">
      <circle cx="1055" cy="44" r="13" fill="#dbe7f0" opacity=".7"/>
      <circle cx="1049" cy="40" r="13" fill="#243a4e"/>
    </g>

    <rect class="mist" x="-40" y="70" width="1280" height="80" fill="url(#fmist)"/>

    <!-- treeline -->
    <g fill="#0a1219">
      <path class="tree" d="M40,150 l16,-58 l16,58 z"/>
      <path class="tree" style="animation-delay:.6s" d="M92,150 l13,-44 l13,44 z"/>
      <path class="tree" style="animation-delay:1.2s" d="M140,150 l18,-66 l18,66 z"/>
      <path class="tree" style="animation-delay:.3s" d="M200,150 l12,-40 l12,40 z"/>
      <path class="tree" style="animation-delay:1.5s" d="M248,150 l16,-54 l16,54 z"/>
      <path class="tree" style="animation-delay:.9s" d="M306,150 l14,-46 l14,46 z"/>
      <path class="tree" style="animation-delay:.2s" d="M360,150 l17,-60 l17,60 z"/>
      <path class="tree" style="animation-delay:1.1s" d="M420,150 l12,-38 l12,38 z"/>
      <path class="tree" style="animation-delay:.7s" d="M468,150 l15,-50 l15,50 z"/>
      <path class="tree" style="animation-delay:1.4s" d="M524,150 l18,-62 l18,62 z"/>
      <path class="tree" style="animation-delay:.4s" d="M586,150 l13,-42 l13,42 z"/>
      <path class="tree" style="animation-delay:1s"  d="M636,150 l16,-56 l16,56 z"/>
      <path class="tree" style="animation-delay:.5s" d="M694,150 l12,-38 l12,38 z"/>
      <path class="tree" style="animation-delay:1.3s" d="M742,150 l17,-58 l17,58 z"/>
      <path class="tree" style="animation-delay:.8s" d="M802,150 l14,-46 l14,46 z"/>
      <path class="tree" style="animation-delay:1.6s" d="M856,150 l16,-54 l16,54 z"/>
      <path class="tree" style="animation-delay:.1s" d="M914,150 l12,-40 l12,40 z"/>
      <path class="tree" style="animation-delay:1.2s" d="M962,150 l18,-64 l18,64 z"/>
      <path class="tree" style="animation-delay:.6s" d="M1024,150 l13,-42 l13,42 z"/>
      <path class="tree" style="animation-delay:1.5s" d="M1074,150 l16,-56 l16,56 z"/>
      <path class="tree" style="animation-delay:.35s" d="M1132,150 l15,-48 l15,48 z"/>
    </g>

    <g fill="#dbe7f0">
      <circle class="flake" cx="140"  cy="0" r="1.4" opacity=".6" style="animation-duration:12s"/>
      <circle class="flake" cx="380"  cy="0" r="1.2" opacity=".5" style="animation-duration:15s; animation-delay:3s"/>
      <circle class="flake" cx="620"  cy="0" r="1.6" opacity=".55" style="animation-duration:10s; animation-delay:5s"/>
      <circle class="flake" cx="880"  cy="0" r="1.3" opacity=".6" style="animation-duration:14s; animation-delay:2s"/>
      <circle class="flake" cx="1120" cy="0" r="1.4" opacity=".5" style="animation-duration:13s; animation-delay:6s"/>
    </g>

    <text class="t" x="600" y="34" text-anchor="middle" fill="#7f9db6" font-size="13" letter-spacing="4">THANKS FOR HIKING UP HERE</text>
    <rect x=".5" y=".5" width="1199" height="149" rx="16" fill="none" stroke="#a9c7dd" stroke-opacity=".12"/>
  </g>
</svg>
