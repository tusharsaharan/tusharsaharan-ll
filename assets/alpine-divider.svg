<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="Divider">
  <style>
    @keyframes sweep { 0% { transform: translateX(-260px) } 100% { transform: translateX(1240px) } }
    @keyframes soft  { 0%,100% { opacity:.25 } 50% { opacity:.6 } }
    .glint { animation: sweep 7s linear infinite }
    .pulse { animation: soft 5s ease-in-out infinite }
    @media (prefers-reduced-motion: reduce) { .glint,.pulse { animation: none } }
  </style>
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a9c7dd" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#a9c7dd" stop-opacity=".45"/>
      <stop offset="82%"  stop-color="#a9c7dd" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#a9c7dd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#dbe7f0" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#dbe7f0" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#dbe7f0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="0" y="0" width="1200" height="24"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <path d="M0,17 L120,17 L168,7 L208,17 L470,17 L520,4 L570,17 L740,17 L790,9 L836,17 L1200,17"
          fill="none" stroke="url(#ln)" stroke-width="1.4"/>
    <circle class="pulse" cx="520" cy="4" r="2" fill="#dbe7f0"/>
    <rect class="glint" x="0" y="16" width="260" height="1.6" fill="url(#gl)"/>
  </g>
</svg>
